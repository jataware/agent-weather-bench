method_scope: Constructed audit experiments; no claim of reproducing CPT, a published method, or an operational forecast system.
curator_choices:
- June-August observed SST predictors and October-December rainfall targets retain the existing frozen CCA subset byte for byte.
- Four readable candidate experiments isolate correct evaluation, whole-record target centering, whole-record predictor screening, and unsupported reuse of development scores.
- Candidate ridge penalty is fixed at one. Repaired methods are freely chosen and need not reproduce ridge.
- Each hindcast issued before OND may use strictly earlier rainfall seasons and its own JJA predictors; production forecasts may use targets through 2019 and their own predictors.
- Scores are equal-weight retrospective diagnostics at twelve neighbouring cells over fifteen years; ranking is disabled.
redistribution_status: Pending human source/data-rights review; internal development only.
