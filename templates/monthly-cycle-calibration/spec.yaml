conventions:
  recipe:
    specified: accepted
pitfalls: {}
public_conventions: []
invariants:
- fitted
- nested
- verification
- production
probes:
- replay
- changed_data
- whole_year_isolation
- forecast_batch_isolation
- saved_state_prediction
claims:
  rainfall_units: Are rainfall predictions and fitted means/scales in mm?
  physical_coefficient_units: Are physical slopes in mm/degree_Celsius?
  dynamical_hindcasts_used: Does this adaptation use dynamical hindcasts?
  full_paper_reproduction: Does this adapted experiment reproduce the source paper
    in full?
interpretation:
- statistical_support
- generalization
- consistency_across_artifacts
judge_questions:
  statistical_support:
    requirement: Any uncertainty or significance claim treats paired whole years as
      blocks; the36month-region cases within a year are not independent replications.
      Silence about inferential claims passes.
    silence: passes
  generalization:
    requirement: "Describe this as specified cyclic standardized-slope method adaptation\
      \ using final-vintage prior-month observed SST and regional CHIRPS. Do not claim\
      \ original CanSIPS paper replication, operational availability at historical\
      \ issue time, or unseen2020\u20132023 outcome gains. Negative deterministic\
      \ predictions are permitted by the method."
    silence: passes
  consistency_across_artifacts:
    requirement: The report, answer, code and computed arrays agree about fitted/validation/production
      procedures, the constant standardized-slope comparator, selection, units and
      actual MSSS.
    silence: passes
assessment_policy:
