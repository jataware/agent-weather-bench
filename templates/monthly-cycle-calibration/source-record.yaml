curator_choices:
- Monthly observed-SST statistical forecasting, explicitly not dynamical hindcast calibration.
- Three real regional targets with equal region weights; exact boxes inherited from source workflow.
- Twelve standardized monthly slopes, cyclic quadratic penalty, six fixed lambdas; source Gaussian filtering and physical pooled coefficient are different.
- Nested expanding WHOLE-year exclusions, production train1993-2019, controller-private2020-2023.
- Preserve negative deterministic predictions as limitations rather than clipping against contract.
