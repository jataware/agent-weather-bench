schema_version: 1
id: focused-astra-accord
kind: agent
description: 'Focused post-checkpoint study: GPT-6 Astra high effort; accord; repaired native import order,
  visible budgets and common delivery-first guidance. Separate from historical checkpoint.'
driver:
  kind: command
  argv:
  - '{python}'
  - '{driver}/adapter.py'
  env:
  - CODEX_BINARY
runtime:
  image: sha256:cfbde79dea2813f21e192e9671a56f7de77ccc1c768d378675850ca3569b837a
  memory: 1536m
  cpus: 2
budget:
  max_seconds: 900
  max_tool_calls: 24
  command_seconds: 120
  max_total_tokens: 180000
substrate:
  paths:
  - adapter.py
  instructions: Read the supplied task and any algorithm files before coding. Deliver a complete reproducible
    submission before optional exploration; reserve budget to rerun it and check its arrays and claims.
    Remaining cumulative token and tool budgets are returned with tool results. Current AfricaS2S and
    acmadDL are installed. Start at /opt/accord-current/docs/africas2s/skills/africas2s/SKILL.md and /opt/accord-current/docs/acmadDL/skills/acmaddl/SKILL.md;
    matching READMEs are in those package documentation directories. Inspect the installed Python API/source
    as needed. Check whether a library method matches the supplied algorithm; adapt it when necessary.
    Inputs are frozen and runtime is offline, so acquisition APIs cannot download new data. Generic Python
    is also allowed.
  libraries:
  - africas2s
  - acmaddl
  image_paths:
  - /opt/accord-current/docs
