schema_version: 1
id: breadth-luna-python-revision
kind: agent
description: Fresh bounded Luna tooling breadth pair revision; assigned arm python.
driver:
  kind: command
  argv:
  - '{python}'
  - '{driver}/adapter.py'
  env:
  - CODEX_BINARY
runtime:
  image: sha256:75bd0583aa30b8c85b77c6f24417bd30c81871a434cbdbc04f65f7b179af1508
  memory: 1536m
  cpus: 2
budget:
  max_seconds: 900
  max_tool_calls: 20
  command_seconds: 120
  max_total_tokens: 350000
  max_uncached_and_output_tokens: 100000
  max_output_tokens: 20000
substrate:
  paths:
  - adapter.py
  instructions: 'Read the task, envelope, supplied guidance and source metadata. Deliver
    complete reproducible arrays, code and claims before optional exploration. Keep
    command output concise: shapes, units and selected metadata. Promote native floating-point
    weather values to float64 before arithmetic. Use serial scientific file I/O, never
    NetCDF/HDF5 reads from Python threads. The request declares cumulative, uncached-plus-output
    and output token caps; tool results display cumulative tokens and remaining time/calls.
    Once the envelope is complete, execute its own command once, check the output
    and finish; avoid repeated optional verification. General scientific Python is
    installed. Implement the requested calculation using these general libraries.'
  libraries: []
  image_paths: []
