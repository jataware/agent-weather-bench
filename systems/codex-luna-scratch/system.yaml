schema_version: 1
id: codex-luna-scratch
kind: agent
description: gpt-6-luna through the Codex adapter, byte-identical to codex-luna's, with the verified CLI
  0.160.0 named by CODEX_BINARY. No added substrate. This is the baseline arm, on the image the two substrate
  arms are built from. The images and the substrate wording are those of the 1 October pilot, so the three
  arms differ only in the substrate.
driver:
  kind: command
  argv:
  - '{python}'
  - '{driver}/adapter.py'
  env:
  - CODEX_BINARY
runtime:
  image: sha256:f3e8ae979462b203c101bf92270943ddb6d559cf852be8a941d1ccd881bf3db7
  memory: 4g
  cpus: 2
budget:
  max_seconds: 900
  max_tool_calls: 90
  command_seconds: 120
substrate:
  paths:
  - adapter.py
  instructions: ''
  libraries: []
  image_paths: []
