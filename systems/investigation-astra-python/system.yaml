schema_version: 1
id: investigation-astra-python
kind: agent
description: 'Parallel investigation: Astra high; matched general dependencies; python tooling condition.
  Separate from historical studies.'
driver:
  kind: command
  argv:
  - '{python}'
  - '{driver}/adapter.py'
  env:
  - CODEX_BINARY
runtime:
  image: sha256:75bd0583aa30b8c85b77c6f24417bd30c81871a434cbdbc04f65f7b179af1508
  memory: 1536m
  cpus: 2
budget:
  max_seconds: 900
  max_tool_calls: 20
  command_seconds: 120
  max_total_tokens: 150000
substrate:
  paths:
  - adapter.py
  instructions: 'Read the task, input metadata and any supplied candidate workflow. Deliver complete reproducible
    results, code and claims before optional exploration; reserve time to rerun and validate. Keep command
    output concise: inspect shapes, units and selected metadata rather than dumping arrays or entire large
    files. Remaining cumulative token and tool-call budgets are visible in tool results. General scientific
    Python is installed; no weather-specific catalog is supplied.'
  libraries: []
  image_paths: []
