schema_version: 1
id: breadth-luna-accord-consolidation
kind: agent
description: Fresh bounded Luna tooling breadth pair consolidation; assigned arm guided_accord.
driver:
  kind: command
  argv:
  - '{python}'
  - '{driver}/adapter.py'
  env:
  - CODEX_BINARY
runtime:
  image: sha256:08dbb4fce25955523a4c3caa3e2efdfb75b960dae3d2b8f3b92746e7f19f7c49
  memory: 1536m
  cpus: 2
budget:
  max_seconds: 900
  max_tool_calls: 20
  command_seconds: 120
  max_total_tokens: 350000
  max_uncached_and_output_tokens: 100000
  max_output_tokens: 20000
substrate:
  paths:
  - adapter.py
  - API.md
  - synthetic_combination.py
  instructions: 'Read the task, envelope, supplied guidance and source metadata. Deliver
    complete reproducible arrays, code and claims before optional exploration. Keep
    command output concise: shapes, units and selected metadata. Promote native floating-point
    weather values to float64 before arithmetic. Use serial scientific file I/O, never
    NetCDF/HDF5 reads from Python threads. The request declares cumulative, uncached-plus-output
    and output token caps; tool results display cumulative tokens and remaining time/calls.
    Once the envelope is complete, execute its own command once, check the output
    and finish; avoid repeated optional verification. Retrieve current source files
    using acquisition.json during every replay; old caches must not override the frozen
    HTTP snapshot. Start by reading /substrate/API.md and running python /substrate/synthetic_combination.py.
    Use the documented public helper substantively: returned helper arrays must feed
    the submitted calculation. General Python remains available for other operations.
    Cite helper call sites in report.md. '
  libraries:
  - africas2s
  image_paths:
  - /opt/accord-current/docs
