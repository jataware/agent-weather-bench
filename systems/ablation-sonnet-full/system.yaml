schema_version: 1
id: ablation-sonnet-full
kind: agent
description: 'Ablation arm 4, the full ACCORD stack: the same backbone, controller, budget and base image as arm
  1, with africas2s and acmadDL installed, their skill guides at /opt/accord-current/docs and the Rhiza weather-skills
  catalog.'
driver:
  kind: anthropic
  model: claude-sonnet-5-5
  api_key_env: ANTHROPIC_API_KEY
  effort: high
  max_usd: 40
  input_usd_per_million: 2
  output_usd_per_million: 10
  cache: true
  cache_write_usd_per_million: 2.5
  cache_read_usd_per_million: 0.1
  max_total_tokens: 80000000
  max_output_tokens: 16000
  max_turns: 900
  max_context_tokens: 900000
  compact_above_tokens: 300000
  max_retries: 5
  response_timeout_seconds: 900
runtime:
  image: sha256:fe804d16d3e78dfc619073ce1368a31fb22e585bc6c47ae446617f117f2d3389
  memory: 6g
  cpus: 2
budget:
  max_seconds: 14400
  max_tool_calls: 600
  command_seconds: 1800
  max_total_tokens: 80000000
substrate:
  paths: []
  instructions: 'The ACCORD libraries africas2s and acmaddl are installed; start at /opt/accord-current/docs/africas2s/skills/africas2s/SKILL.md
    and /opt/accord-current/docs/acmadDL/skills/acmaddl/SKILL.md. Weather skills are under /catalog/skills (the
    Rhiza weather-skills and CHC skills catalogs; discover them with find /catalog/skills -name SKILL.md); run skill
    scripts with python, not uv run: dependencies are preinstalled and the runtime is offline. The runtime reaches
    only the task''s frozen source service, so acquisition APIs cannot download from live providers. Generic Python
    is also allowed.'
  libraries:
  - africas2s
  - acmaddl
  - weather_skills_core
  image_paths:
  - /opt/accord-current/docs
  - /catalog/skills
