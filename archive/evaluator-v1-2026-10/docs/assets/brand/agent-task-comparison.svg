</symbol></defs><text x="48" y="51" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#19383d" letter-spacing="-0.5">One task. Two system configurations.</text><text x="48" y="83" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Hold the model, inputs, runtime, budget, and judge fixed. Change access to task-specific tools.</text><text x="48" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">(a) Task</text><text x="292" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#19383d">Prepare data</text><text x="590" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#19383d">Build a forecast</text><text x="890" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#19383d">Verify the result</text><path d="M508 123 H567" fill="none" stroke="#526c6e" stroke-width="1.8" marker-end="url(#flow)"/><path d="M806 123 H865" fill="none" stroke="#526c6e" stroke-width="1.8" marker-end="url(#flow)"/><path d="M48 157 H1512" stroke="#dce2e5"/><text x="48" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">(b) System attempts</text><text x="1236" y="192" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">(c) Shared grading</text><rect x="40" y="212" width="1118" height="177" rx="12" fill="#f6f8fa" stroke="#f6f8fa"/><rect x="40" y="459" width="1118" height="179" rx="12" fill="#eff6f2" stroke="#eff6f2"/><text x="61" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#19383d">A  General tools</text><use href="#robot" x="98" y="250" width="82" height="82"/><text x="77" y="351" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#19383d">Same AI model</text><text x="61" y="376" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">Code + shell</text><text x="61" y="486" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#19383d">B  With task tools</text><use href="#robot" x="98" y="497" width="82" height="82"/><text x="77" y="598" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#19383d">Same AI model</text><text x="61" y="623" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">Code + shell + task tools</text><rect x="292" y="243" width="232" height="125" rx="9" fill="white" stroke="#28786b"/><text x="308" y="275" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">1  Prepare</text><text x="308" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#28786b">Valid inputs</text><text x="308" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Files + coordinates match</text><circle cx="505" cy="316" r="11" fill="white" stroke="#28786b" stroke-width="1.8"/><path d="M500 316 L504 320 L511 312" fill="none" stroke="#28786b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="243" width="232" height="125" rx="9" fill="#fff6f2" stroke="#a44c3d"/><text x="606" y="275" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">2  Forecast</text><text x="606" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#a44c3d">Invalid calibration</text><text x="606" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Reference check fails</text><circle cx="803" cy="316" r="11" fill="white" stroke="#a44c3d" stroke-width="1.8"/><path d="M799 312 L807 320 M807 312 L799 320" stroke="#a44c3d" stroke-width="2" stroke-linecap="round"/><rect x="888" y="243" width="232" height="125" rx="9" fill="#fff6f2" stroke="#a44c3d"/><text x="904" y="275" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">3  Verify</text><text x="904" y="317" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#a44c3d">No valid forecast</text><text x="904" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Blocked by step 2</text><circle cx="1101" cy="316" r="11" fill="white" stroke="#a44c3d" stroke-width="1.8"/><path d="M1097 312 L1105 320 M1105 312 L1097 320" stroke="#a44c3d" stroke-width="2" stroke-linecap="round"/><rect x="292" y="490" width="232" height="125" rx="9" fill="white" stroke="#28786b"/><text x="308" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">1  Prepare</text><text x="308" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#28786b">Valid inputs</text><text x="308" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Files + coordinates match</text><circle cx="505" cy="563" r="11" fill="white" stroke="#28786b" stroke-width="1.8"/><path d="M500 563 L504 567 L511 559" fill="none" stroke="#28786b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="490" width="232" height="125" rx="9" fill="white" stroke="#28786b"/><text x="606" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">2  Forecast</text><text x="606" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#28786b">Valid calibration</text><text x="606" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Saved model + predictions</text><circle cx="803" cy="563" r="11" fill="white" stroke="#28786b" stroke-width="1.8"/><path d="M798 563 L802 567 L809 559" fill="none" stroke="#28786b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="888" y="490" width="232" height="125" rx="9" fill="white" stroke="#28786b"/><text x="904" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#19383d">3  Verify</text><text x="904" y="564" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#28786b">Verified result</text><text x="904" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Replay + score against data</text><circle cx="1101" cy="563" r="11" fill="white" stroke="#28786b" stroke-width="1.8"/><path d="M1096 563 L1100 567 L1107 559" fill="none" stroke="#28786b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M531 305 H578" fill="none" stroke="#526c6e" stroke-width="2" marker-end="url(#flow)"/><path d="M829 305 H876" fill="none" stroke="#526c6e" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#flow)"/><path d="M1128 305 H1207" fill="none" stroke="#526c6e" stroke-width="2" marker-end="url(#flow)"/><path d="M531 552 H578" fill="none" stroke="#526c6e" stroke-width="2" marker-end="url(#flow)"/><path d="M829 552 H876" fill="none" stroke="#526c6e" stroke-width="2" marker-end="url(#flow)"/><path d="M1128 552 H1207" fill="none" stroke="#526c6e" stroke-width="2" marker-end="url(#flow)"/><rect x="292" y="421" width="232" height="37" rx="7" fill="#e0eee6" stroke="#abc6b7"/><text x="308" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#28786b">Data access</text><path d="M408 458 V482" fill="none" stroke="#28786b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#flow)"/><rect x="590" y="421" width="232" height="37" rx="7" fill="#e0eee6" stroke="#abc6b7"/><text x="606" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#28786b">Calibration</text><path d="M706 458 V482" fill="none" stroke="#28786b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#flow)"/><rect x="888" y="421" width="232" height="37" rx="7" fill="#e0eee6" stroke="#abc6b7"/><text x="904" y="446" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#28786b">Verification</text><path d="M1004 458 V482" fill="none" stroke="#28786b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#flow)"/><text x="61" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#28786b">Available task tools →</text><rect x="1220" y="212" width="292" height="426" rx="12" fill="white" stroke="#b7c6ca"/><text x="1240" y="249" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#19383d">Same checks</text><text x="1240" y="279" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">Reference · reruns · judge</text><path d="M1240 293 H1492" stroke="#dce2e5"/><text x="1240" y="336" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#a44c3d">A  Partial</text><text x="1240" y="367" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">Prepare passed. Forecast failed.</text><text x="1240" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">Verification blocked, so failed.</text><path d="M1240 414 H1492" stroke="#dce2e5"/><text x="1240" y="461" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#19383d">Private grading evidence</text><text x="1240" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#526c6e">Reference outputs + observations</text><text x="1240" y="539" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#28786b">B  Complete</text><text x="1240" y="569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">All required outcomes passed.</text><path d="M1240 589 H1492" stroke="#dce2e5"/><text x="1240" y="618" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#19383d">Record tokens, cost, and time.</text><text x="49" y="671" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#526c6e">✓ passed     × failed</text><text x="49" y="716" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#19383d">Illustrative attempts, not measured benchmark results.</text><text x="49" y="744" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">Tool access may change success, cost, or time. Measure its effect with paired runs across models and tasks.</text>
