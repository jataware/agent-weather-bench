<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="770" viewBox="0 0 1560 770" role="img" aria-labelledby="title description">
<title id="title">An agent attempts the same three-step task with and without task tools</title><desc id="description">Two identical emoji-style robot agents represent the same AI model. Both prepare data, build a forecast, and verify it. The general-tools example passes preparation, fails calibration, and leaves verification incomplete. The task-tools example uses data access, calibration, and verification tools and completes all steps. Both are graded with the same private rubric and evidence. The outcomes are illustrative, not measured results.</desc>
<rect width="1560" height="770" fill="white"/><defs>
<marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526c6e" stroke-width="1.7"/></marker>
<symbol id="robot" viewBox="0 0 96 96">
<path d="M48 21 V9" stroke="#536976" stroke-width="4"/><circle cx="48" cy="8" r="5" fill="#e5b95e"/>
<rect x="8" y="41" width="10" height="22" rx="4" fill="#8ca3b1"/><rect x="78" y="41" width="10" height="22" rx="4" fill="#8ca3b1"/>
<rect x="17" y="23" width="62" height="61" rx="17" fill="#dce7ec" stroke="#536976" stroke-width="2.5"/>
<rect x="23" y="29" width="50" height="28" rx="10" fill="#f5fafb"/>
<circle cx="34" cy="43" r="6" fill="#19383d"/><circle cx="62" cy="43" r="6" fill="#19383d"/>
