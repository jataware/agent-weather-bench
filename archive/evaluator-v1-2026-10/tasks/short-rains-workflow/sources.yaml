curator_choices:
  - Three fixed regional boxes from source targets, with source finite-land support retained.
  - September 30 issue and conservative August 31 observed-SST cutoff.
  - 108 bounded source-inspired candidates, univariate OLS Student-t predictive uncertainty, identity/log1p transforms.
  - Inner and outer expanding windows; strict training-only transforms and thresholds.
  - Fixed 2019 training cutoff for independent 2020–2023 prediction cases.
