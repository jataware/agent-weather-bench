adaptations:
- Six bounded East Africa station IDs; initial five preserved and Entebbe added for reporting coverage before any forecast errors inspected.
- January 1-20 2020 00UTC issues and 24/72/120/168h leads; exact valid UTC time only.
- Strict TMP QC flags 1 and 5, missing +9999 rejected; deterministic report selection with FM-12 priority.
- Compare bilinear and nearest interpolation of the same existing coarse-grid forecast; no terrain or station bias correction.
- Equal observation-sample headline RMSE plus equal-station sensitivity estimate; station sample sizes exposed.
- Supplied method availability mask and comparison faults explicitly curator constructed; weather and QC values real.
- No station data replaced by ERA5, no WeatherReal-native 2023 rank reproduction, no inference that this task sets frontier capability difficulty.
