method_scope: Bounded method adaptation, not original published-paper numerical replication or exact CPT binary parity.
curator_choices:
- Prior June-August observed SST predicts OND rainfall at small native grid subsets.
- Nested expanding-year selection over fourteen joint EOF/CCA truncations using standardized area-weighted MSE, rather than source CPT Kendall mode selection.
- Rotation-invariant squared-norm leverage replaces CPT sign-dependent square-of-sum convention.
- Student-t uncertainty uses training-local fixed-configuration leave-one-out residual variance.
- Frozen final train1993-2019 and controller-only2020-2023 targets; historical public sources may already be known.
redistribution_status: Pending human source/data-rights review; internal development only.
