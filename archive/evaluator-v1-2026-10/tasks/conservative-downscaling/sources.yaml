curator_choices:
- Four fixed one-degree inland Kenya cells with exact nominal .05degree nested fine geometry.
- Explicit small coordinate encoding snap; native precipitation values unchanged.
- Raw predictors treated as unknown-scale monotonic values, not physically converted rates.
- Rank-linear empirical interpolation with tied-group averaging and clamped tails.
- Positive fine climatology ratio normalized by spherical cell area, rather than additive interpolated detail.
- Training1993–2008, retrospective leave-one-year-out within training, private prediction-year fine targets2009–2016.
