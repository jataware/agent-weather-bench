    variable: 2m_temperature
    units: K
    license_snapshot: source-material/hres-LICENSE.txt
  - id: wb2-era5
    url: gs://weatherbench2/datasets/era5/1959-2022-6h-64x32_equiangular_conservative.zarr
    variable: 2m_temperature
    units: K
    license_snapshot: source-material/era5-LICENSE.txt
  - id: wb2-climatology
    url: gs://weatherbench2/datasets/era5-hourly-climatology/1990-2019_6h_64x32_equiangular_conservative.zarr
    variable: 2m_temperature
    units: K
    license_snapshot: source-material/climatology-LICENSE.txt
curator_controls:
  id: curator-comparison-controls
  constructed: true
  files: [source-material/broken-comparison.py, availability.nc]
  role: Disclosed comparison faults and availability stress test; no historical upstream defect assertion.
documentation:
  - url: https://weatherbench2.readthedocs.io/en/latest/data-guide.html
  - url: https://weatherbench2.readthedocs.io/en/latest/official-evaluation.html
limitations:
  - Public retrospective subset; not a pristine holdout or station observations.
  - Different grid/month from complete published evaluation; no annual-ranking claim.
  - Dataset redistribution approval pending actual dataset license review.
  - Availability dropout and three comparison faults are curator constructions, explicitly disclosed.
