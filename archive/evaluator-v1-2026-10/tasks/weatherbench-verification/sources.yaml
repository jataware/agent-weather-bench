  title: 'WeatherBench 2: A Benchmark for the Next Generation of Data-Driven Global Weather Models'
  authors: Rasp et al.
  published: 2024-06-18
  doi: 10.1029/2023MS004019
  url: https://doi.org/10.1029/2023MS004019
  role: Evaluation design and interpretation; no claim to reproduce complete published figures.
implementation:
  id: wb2-code
  repository: https://github.com/google-research/weatherbench2
  revision: d2c6a1553a0c532332d4c2d3be285508c514bfc2
  path: weatherbench2/metrics.py
  license: Apache-2.0
  snapshot: source-material/upstream-metrics.py
  role: Cell-area weights, per-case MSE, anomaly correlation and temporal aggregation.
datasets:
  - id: wb2-hres
