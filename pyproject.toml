[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-weather-bench"
version = "1.0.0"
description = "A benchmark of parameterised weather-research templates, assessed in Docker, for comparing agent systems"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "xarray", "netCDF4", "scipy", "h5netcdf", "h5py", "zarr", "PyYAML", "httpx", "Pillow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "python-pptx"]

[project.scripts]
weather-bench = "assessment.__main__:main"

[tool.setuptools.packages.find]
include = ["assessment*"]

[tool.setuptools.package-data]
"assessment" = ["*.md", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
