<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 1.5; rx: 6; }
    .shade { fill: #f3f4f6; stroke: #333; stroke-width: 1.5; rx: 6; }
    .dark { fill: #1f2937; stroke: #1f2937; rx: 6; }
    .title { font-size: 18px; font-weight: bold; fill: #111; }
    .label { fill: #111; }
    .small { font-size: 13px; fill: #333; }
    .white { fill: #fff; font-size: 15px; }
    .arrow { stroke: #333; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .cap { font-size: 13px; fill: #555; }
  </style>

  <text x="700" y="34" text-anchor="middle" class="title">How one run of the agent weather benchmark works</text>

  <!-- 1. system under evaluation -->
  <rect x="30" y="70" width="300" height="215" class="shade"/>
  <text x="180" y="96" text-anchor="middle" class="title">1. The system</text>
  <text x="45" y="124" class="label">Model</text>
  <text x="45" y="146" class="small">cheap to frontier</text>
  <text x="45" y="172" class="label">Harness</text>
  <text x="45" y="194" class="small">built-in, Codex adapter, rx</text>
  <text x="45" y="220" class="label">Substrate</text>
  <text x="45" y="242" class="small">none, Rhiza skills, ACCORD libraries</text>
  <text x="45" y="258" class="small">+ supplied structure: a conventions sheet,</text>
  <text x="45" y="274" class="small">a method description, or earlier work</text>

  <!-- 2. task instance -->
  <rect x="30" y="310" width="300" height="150" class="shade"/>
  <text x="180" y="336" text-anchor="middle" class="title">2. The task instance</text>
  <text x="45" y="364" class="small">One template, one region, one time window</text>
  <text x="45" y="386" class="small">A short brief that states the product</text>
  <text x="45" y="408" class="small">Frozen data, no network</text>
  <text x="45" y="430" class="small">A budget of time and tokens</text>
  <text x="45" y="450" class="small">Checked as product, process or outcome</text>

  <!-- 3. sandbox -->
  <rect x="370" y="70" width="250" height="390" class="box"/>
  <text x="495" y="96" text-anchor="middle" class="title">3. The sandbox</text>
  <text x="385" y="124" class="small">The agent reads the data, writes code,</text>
  <text x="385" y="142" class="small">runs it, and delivers:</text>
  <rect x="385" y="160" width="220" height="270" class="shade"/>
  <text x="395" y="186" class="label">results.zarr</text>
  <text x="395" y="204" class="small">arrays with named dimensions</text>
  <text x="395" y="222" class="small">and coordinate labels</text>
  <text x="395" y="250" class="label">answer.json</text>
  <text x="395" y="268" class="small">numbers, choices, claims,</text>
  <text x="395" y="286" class="small">method notes, run command</text>
  <text x="395" y="314" class="label">the code</text>
  <text x="395" y="332" class="small">one command regenerates the</text>
  <text x="395" y="350" class="small">results from the data</text>
  <text x="395" y="378" class="label">report.md</text>
  <text x="395" y="396" class="small">what was done, what it means,</text>
  <text x="395" y="414" class="small">and its limits</text>
  <text x="495" y="450" text-anchor="middle" class="small">The controller records the whole tool trace.</text>

  <!-- 4. controller checks -->
  <rect x="660" y="70" width="400" height="390" class="box"/>
  <text x="860" y="96" text-anchor="middle" class="title">4. The controller checks the delivery</text>
  <text x="675" y="124" class="label">Reference answer, under every reading of the brief</text>
  <text x="675" y="142" class="small">accepts any defensible convention; names a known pitfall</text>
  <text x="675" y="170" class="label">Probes: rerun the agent's own code</text>
  <text x="675" y="188" class="small">on the original data, on changed data, on data a valid</text>
  <text x="675" y="206" class="small">method must not use (nothing from the future)</text>
  <text x="675" y="234" class="label">Invariants and claims</text>
  <text x="675" y="252" class="small">rules every valid answer obeys; conclusions follow from</text>
  <text x="675" y="270" class="small">the submission's own numbers</text>
  <text x="675" y="298" class="label">Process checklist, from a published standard</text>
  <text x="675" y="316" class="small">each step judged by the most exact evidence available</text>
  <text x="675" y="344" class="label">Skill against withheld observations</text>
  <text x="675" y="362" class="small">for forecasts; the leaderboard score</text>
  <text x="675" y="390" class="label">Judge: Claude Opus 5.5, one narrow question at a time</text>
  <text x="675" y="408" class="small">report against code and answer; must quote exact text;</text>
  <text x="675" y="426" class="small">12 of 12 control cases</text>
  <text x="860" y="450" text-anchor="middle" class="small">Each spec is certified by five tests before it counts.</text>

  <!-- 5. outcome -->
  <rect x="1110" y="70" width="260" height="200" class="dark"/>
  <text x="1240" y="96" text-anchor="middle" class="white" font-weight="bold" font-size="18">5. The result</text>
  <text x="1125" y="126" class="white"><tspan font-weight="bold">pass</tspan>  the delivery is right</text>
  <text x="1125" y="152" class="white"><tspan font-weight="bold">fail</tspan>  the submission is at fault,</text>
  <text x="1125" y="170" class="white">        with the pitfall or check named</text>
  <text x="1125" y="196" class="white"><tspan font-weight="bold">unresolved</tspan>  a cause outside the</text>
  <text x="1125" y="214" class="white">        submission, with a reason code</text>
  <text x="1125" y="246" class="white" font-size="13">+ skill, cost, tokens, time, provenance</text>

  <!-- 6. experiments -->
  <rect x="1110" y="310" width="260" height="150" class="shade"/>
  <text x="1240" y="336" text-anchor="middle" class="title">6. The experiments</text>
  <text x="1125" y="362" class="small">Change one part of the system at a time:</text>
  <text x="1125" y="382" class="small">model ladder, harness, substrate value,</text>
  <text x="1125" y="400" class="small">supplied structure, accretion across</text>
  <text x="1125" y="418" class="small">episodes, leaderboard, judge validation</text>
  <text x="1125" y="446" class="small">Same instances and checks for all.</text>

  <!-- arrows -->
  <path d="M 330 170 L 370 170" class="arrow"/>
  <path d="M 330 385 L 370 385" class="arrow"/>
  <path d="M 620 265 L 660 265" class="arrow"/>
  <path d="M 1060 170 L 1110 170" class="arrow"/>
  <path d="M 1240 270 L 1240 310" class="arrow"/>

  <!-- 7. second episode -->
  <rect x="30" y="500" width="1340" height="110" class="box"/>
  <text x="700" y="526" text-anchor="middle" class="title">7. A second episode measures whether work accumulates</text>
  <text x="45" y="556" class="small">The same system runs another instance, another level or another task, and receives its earlier submission under /work/prior. It may reuse, adapt or ignore it.</text>
  <text x="45" y="578" class="small">The controller counts the commands that touch the earlier work and compares cost, tokens, time and outcome with a fresh run of the same instance.</text>
  <text x="45" y="600" class="small">Example sequence: seasonal calibration for Ethiopia, then Kenya, then Nigeria, with the retained and the reset arm side by side.</text>

  <!-- footer -->
  <text x="30" y="650" class="cap">Status on 7 October 2026: three templates certified (Kenya forecast revision, weeks 3–4 rainfall, seasonal calibration to the WMO guidance); 36 attempts by one cheap model;</text>
  <text x="30" y="670" class="cap">the judge run on all of them. Twenty-two templates, the standards as primary documents, stronger solvers and the experiments are still to come. See docs/roadmap.md.</text>
  <text x="30" y="710" class="cap">Terms: a template is a task with region and time window as parameters; a substrate is the tools and knowledge in the agent's workspace; a pitfall is a known wrong method with a computable wrong answer;</text>
  <text x="30" y="730" class="cap">a probe is a rerun of the agent's code on changed data; the controller is the trusted program that runs the agent, holds the references and runs the checks.</text>
</svg>
