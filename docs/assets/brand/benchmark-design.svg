<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
<title id="title">Agent Weather Bench experimental design</title><desc id="description">Compare models, harnesses and tooling on the same task instances. A task states a product and supplies frozen data and a budget; an agent in a sandbox delivers a solution and a trace; the controller checks it by computation against a private reference, by rerunning the code on changed data, and by a judge that quotes exact text. Every check returns pass, fail or unresolved. Further experiments keep the earlier solution for the next instance, and optimise forecasts for a leaderboard.</desc>
<rect width="1440" height="820" rx="16" fill="#f6f4ed"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#28786b" stroke-width="1.5"/></marker></defs><text x="56" y="57" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#28786b" letter-spacing="2">THE BENCHMARK</text><text x="56" y="111" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="600" fill="#19383d" letter-spacing="-1">Same tasks. Different systems.</text><text x="57" y="149" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526c6e">Compare models, harnesses and tooling on the same task instances, with the same checks each time.</text><text x="56" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">01 / DEFINE</text><text x="396" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">02 / EXECUTE</text><text x="736" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">03 / CAPTURE</text><text x="1076" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">04 / ASSESS</text><rect x="56" y="212" width="280" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><rect x="396" y="212" width="280" height="238" rx="12" fill="#e8efe7" stroke="#cbd7d0"/><rect x="736" y="212" width="280" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><rect x="1076" y="212" width="300" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><text x="80" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Task + tooling</text><text x="80" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">A product, not a method</text><text x="80" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Frozen data · a budget</text><text x="80" y="363" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Tooling in or out</text><path d="M80 387 H312" stroke="#cbd7d0"/><text x="80" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Region and window are parameters</text><text x="420" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.6">Agent in a sandbox</text><text x="420" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">A model, driven by a harness</text><text x="420" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">No network · fixed budget</text><text x="420" y="363" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Any method, any code</text><path d="M420 387 H652" stroke="#cbd7d0"/><text x="420" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Skills · libraries · earlier work</text><text x="760" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Solution + trace</text><text x="760" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Labelled arrays + answer</text><text x="760" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Code that regenerates them</text><text x="760" y="363" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Report · every command</text><path d="M760 387 H992" stroke="#cbd7d0"/><text x="760" y="421" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#28786b">Hashes, cost and time kept by the controller</text><text x="1100" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Controller checks</text><text x="1100" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Compute against a reference</text><text x="1100" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Rerun the code on changed data</text><text x="1100" y="363" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Judge on exact quotations</text><path d="M1100 387 H1352" stroke="#cbd7d0"/><text x="1100" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Pass · fail · unresolved, per check</text><path d="M343 327 H387" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M683 327 H727" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1023 327 H1067" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="736" y="500" width="640" height="116" rx="10" fill="#edece4" stroke="#cbd7d0"/><text x="760" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#28786b" letter-spacing="1.4">CONTROLLER ONLY</text><text x="760" y="562" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#19383d">Private reference under every reading + withheld observations</text><text x="760" y="592" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">A known wrong reading is named as a pitfall. Skill is scored for forecasts.</text><path d="M1226 500 V459" fill="none" stroke="#28786b" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="56" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.5">PRIMARY COMPARISON</text><text x="56" y="557" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Model · harness · tooling</text><text x="56" y="591" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Pass rate, cost and time per task</text><path d="M56 647 H1376" stroke="#cbd7d0"/><text x="56" y="693" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.5">ADDITIONAL EXPERIMENTS</text><text x="56" y="731" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Episodes: keep the earlier work.</text><text x="56" y="764" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Leaderboard: optimise the forecast within a budget.</text><path d="M536 450 V710 H1038 M876 450 V481 H698 V710" fill="none" stroke="#28786b" stroke-width="2.5"/><rect x="734" y="683" width="275" height="51" rx="0" fill="#f6f4ed" stroke="#f6f4ed"/><text x="750" y="704" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#28786b">The earlier solution</text><text x="750" y="730" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#28786b">+ the agent&#x27;s state</text><path d="M1007 710 H1066" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1076" y="677" width="300" height="91" rx="10" fill="#e8efe7" stroke="#cbd7d0"/><text x="1100" y="711" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#19383d" letter-spacing="-0.4">Next instance or task</text><text x="1100" y="744" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">Same system · compared with a fresh run</text>
</svg>
