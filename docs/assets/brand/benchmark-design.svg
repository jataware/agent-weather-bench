<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
<title id="title">Agent Weather Bench experimental design</title><desc id="description">Compare AI models on common research tasks with general tools and fixed scoring. Assess correctness, completion, cost, and time using private references and later observations where applicable. Further experiments add substrate or test reuse across other tasks. Only agent-owned state and prior artifacts carry into the next task.</desc>
<rect width="1440" height="820" rx="16" fill="#f6f4ed"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#28786b" stroke-width="1.5"/></marker></defs><text x="56" y="57" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#28786b" letter-spacing="2">THE BENCHMARK</text><text x="56" y="111" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="600" fill="#19383d" letter-spacing="-1">Same tasks. Different models.</text><text x="57" y="149" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526c6e">Compare models with common tools, fixed data boundaries, budgets, and scoring.</text><text x="56" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">01 / DEFINE</text><text x="396" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">02 / EXECUTE</text><text x="736" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">03 / CAPTURE</text><text x="1076" y="197" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.4">04 / ASSESS</text><rect x="56" y="212" width="280" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><rect x="396" y="212" width="280" height="238" rx="12" fill="#e8efe7" stroke="#cbd7d0"/><rect x="736" y="212" width="280" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><rect x="1076" y="212" width="300" height="238" rx="12" fill="#ffffff" stroke="#cbd7d0"/><text x="80" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Research task</text><text x="80" y="301" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526c6e">Scientific goal</text><text x="80" y="332" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526c6e">Brief + frozen inputs</text><text x="80" y="363" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526c6e">Weighted rubric</text><path d="M80 387 H312" stroke="#cbd7d0"/><text x="80" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Sources from the field</text><text x="420" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.6">AI model</text><text x="420" y="301" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Gemini · Claude · GPT</text><text x="420" y="332" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Open-weight models</text><text x="420" y="363" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526c6e">Common tool environment</text><path d="M420 387 H652" stroke="#cbd7d0"/><text x="420" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">General tools · same budget</text><text x="760" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Frozen artifacts</text><text x="760" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Code + data + report</text><text x="760" y="332" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Provenance + handoff</text><text x="760" y="363" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#526c6e">Exact artifact hashes</text><path d="M760 387 H992" stroke="#cbd7d0"/><text x="760" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Tokens · cost · wall time</text><text x="1100" y="259" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#19383d" letter-spacing="-0.5">Locked assessment</text><text x="1100" y="301" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Validity + tolerances</text><text x="1100" y="332" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Replay + scientific review</text><text x="1100" y="363" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Completion · cost · time</text><path d="M1100 387 H1352" stroke="#cbd7d0"/><text x="1100" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#28786b">Skill is a reported outcome</text><path d="M343 327 H387" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M683 327 H727" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1023 327 H1067" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="736" y="500" width="640" height="116" rx="10" fill="#edece4" stroke="#cbd7d0"/><text x="760" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#28786b" letter-spacing="1.4">CONTROLLER ONLY</text><text x="760" y="562" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Private references + later observations</text><text x="760" y="592" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">Later observations apply to forecast tasks. Targets stay outside execution.</text><path d="M1226 500 V459" fill="none" stroke="#28786b" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="56" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.5">PRIMARY COMPARISON</text><text x="56" y="557" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Model capability</text><text x="56" y="591" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Cost and time to solution</text><path d="M56 647 H1376" stroke="#cbd7d0"/><text x="56" y="693" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#28786b" letter-spacing="1.5">ADDITIONAL EXPERIMENTS</text><text x="56" y="731" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500" fill="#19383d">Add skills, code, or retrieval.</text><text x="56" y="764" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#526c6e">Test support and reuse across tasks.</text><path d="M536 450 V710 H1038 M876 450 V481 H698 V710" fill="none" stroke="#28786b" stroke-width="2.5"/><rect x="734" y="683" width="275" height="51" rx="0" fill="#f6f4ed" stroke="#f6f4ed"/><text x="750" y="704" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#28786b">Agent-owned state</text><text x="750" y="730" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#28786b">+ prior artifacts</text><path d="M1007 710 H1066" fill="none" stroke="#28786b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1076" y="677" width="300" height="91" rx="10" fill="#e8efe7" stroke="#cbd7d0"/><text x="1100" y="711" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#19383d" letter-spacing="-0.4">Next benchmark task</text><text x="1100" y="744" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c6e">Fresh conversation · same system</text>
